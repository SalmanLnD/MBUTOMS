# Render Blueprint: static frontend + Node API.
# WhatsApp bridge stays on AWS.
services:
  - type: web
    name: mbutoms
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://mbutoms-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: mbutoms-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_STARTUP_SYNC
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_GEMINI_FREE_TIER_CONFIRMED
        value: "true"
      - key: AI_GEMINI_FREE_RPM
        value: "15"
      - key: AI_GEMINI_FREE_TPM
        value: "250000"
      - key: AI_GEMINI_FREE_RPD
        value: "500"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://mbutoms.onrender.com,https://mbutoms.vercel.app,http://localhost:5173,http://localhost:5174
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        value: https://mbutoms.onrender.com
      - key: API_PUBLIC_URL
        value: https://mbutoms-api.onrender.com
      - key: WHATSAPP_WEBHOOK_SECRET
        sync: false
