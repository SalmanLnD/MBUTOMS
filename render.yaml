# Render Blueprint: static frontend + Node API.
# WhatsApp bridge stays on AWS.
services:
  - type: web
    name: mbutoms
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://mbutoms-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: mbutoms-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_STARTUP_SYNC
        value: "false"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://mbutoms.onrender.com,https://mbutoms.vercel.app,http://localhost:5173,http://localhost:5174
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_PUBLIC_URL
        value: https://mbutoms-api.onrender.com
      - key: WHATSAPP_WEBHOOK_SECRET
        sync: false
